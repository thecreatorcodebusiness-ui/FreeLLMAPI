name: OmniRoute isolated network preflight

on:
  push:
    branches:
      - experiment/omniroute-net-isolation
    paths:
      - .github/workflows/omniroute-network-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omniroute-isolation-preflight
  cancel-in-progress: true

jobs:
  isolation-preflight:
    name: Disposable Docker network-none verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Runner and Docker preflight
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info --format 'Docker security options: {{json .SecurityOptions}}'
      - name: Pull preflight image outside isolated test
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:22-bookworm-slim
      - name: Verify network-none container has loopback only
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --user 1000:1000 \
            node:22-bookworm-slim \
            node -e '
              const os = require("node:os");
              const http = require("node:http");
              const net = require("node:net");
              const interfaces = os.networkInterfaces();
              const names = Object.keys(interfaces);
              if (names.some(name => name !== "lo")) {
                console.error("FAIL: Non-loopback interface present", names);
                process.exit(1);
              }
              const server = http.createServer((_req, res) => res.end("loopback-ok"));
              server.listen(0, "127.0.0.1", () => {
                const port = server.address().port;
                http.get("http://127.0.0.1:" + port, res => {
                  let body = "";
                  res.on("data", part => body += part);
                  res.on("end", () => {
                    server.close();
                    if (res.statusCode !== 200 || body !== "loopback-ok") process.exitCode = 1;
                    else console.log("PASS: Loopback HTTP works and only lo is present");
                  });
                }).on("error", err => {
                  console.error("FAIL: Loopback unavailable", err.code);
                  server.close();
                  process.exitCode = 1;
                });
              });
            '
      - name: Scope and result
        shell: bash
        run: |
          echo "PASS: Network-none isolation preflight only."
          echo "OmniRoute was not installed, started, patched or tested."
          echo "External egress prevention was inferred from Docker network-none and interface enumeration; no packet-level attempt audit was performed."
