name: Free Claude provider metadata audit

on:
  push:
    branches:
      - experiment/omniroute-phase3
    paths:
      - .github/workflows/free-claude-metadata-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-catalog-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Query public Pollinations metadata only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provider-audit"
          curl --fail --show-error --silent --location --max-time 20 --retry 1 \
            --header 'Accept: application/json' \
            'https://gen.pollinations.ai/text/models?query=claude&limit=100' \
            --output "$RUNNER_TEMP/provider-audit/catalog.json"
          python3 - "$RUNNER_TEMP/provider-audit/catalog.json" "$RUNNER_TEMP/provider-audit/results.json" <<'PY'
          import json, sys, datetime
          source, dest = sys.argv[1:3]
          with open(source, encoding="utf-8") as f:
              payload = json.load(f)
          if isinstance(payload, list):
              entries = payload
          elif isinstance(payload, dict):
              entries = next((payload[k] for k in ("data", "models", "items", "results") if isinstance(payload.get(k), list)), [])
          else:
              entries = []
          results = []
          for m in entries:
              if not isinstance(m, dict):
                  continue
              mid = str(m.get("id", m.get("model", m.get("name", ""))))
              aliases = m.get("aliases", [])
              if not isinstance(aliases, list):
                  aliases = []
              label = " ".join((mid, str(m.get("title", "")), str(m.get("publisher", "")), " ".join(map(str, aliases)))).lower()
              if "claude" not in label and "anthropic" not in label:
                  continue
              pricing = m.get("pricing", m.get("price", m.get("prices")))
              fields = {k:m[k] for k in ("input_price", "output_price", "prompt_price", "completion_price", "paidOnly", "requires_api_key", "per_user_rpm") if k in m}
              results.append({"id":mid, "publisher":m.get("publisher"), "pricing_raw":pricing, "price_related_fields":fields})
          report = {
              "checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "catalog_endpoint":"https://gen.pollinations.ai/text/models?query=claude&limit=100",
              "catalog_entries_count":len(entries),
              "claude_candidates":results,
              "live_inference_performed":False,
              "cost_certified_zero":False,
              "reason":"Catalog metadata cannot establish account eligibility, authorisation, quota or actual billing. Generation requires an authorised API key; no inference request was made."
          }
          with open(dest, "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2, ensure_ascii=False)
          print("Catalog entries:", len(entries))
          print("Claude candidates:", len(results))
          for x in results:
              print("MODEL",x["id"],"pricing",str(x["pricing_raw"])[:300],"other",x["price_related_fields"])
          print("AUDIT COMPLETE: metadata only. No inference or credentials.")
          PY
      - name: Inspect xKiro public Claude model access tiers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provider-audit"
          curl --fail --show-error --silent --location --max-time 20 --retry 1 \
            --header 'Accept: application/json' \
            'https://api.xkiro.com/v1/models' \
            --output "$RUNNER_TEMP/provider-audit/xkiro-catalog.json"
          python3 - "$RUNNER_TEMP/provider-audit/xkiro-catalog.json" "$RUNNER_TEMP/provider-audit/xkiro-results.json" <<'PY'
          import json,sys,datetime
          with open(sys.argv[1], encoding="utf-8") as f: payload=json.load(f)
          items=payload.get("data",[]) if isinstance(payload,dict) else (payload if isinstance(payload,list) else [])
          matches=[]
          for m in items:
              if not isinstance(m,dict): continue
              mid=str(m.get("id",""))
              if "claude" not in mid.lower() and "anthropic" not in mid.lower(): continue
              tier=m.get("tier", m.get("access_tier",m.get("accessTier")))
              pricing=m.get("pricing")
              matches.append({"id":mid,"tier":tier,"pricing":pricing,"free_label_present":m.get("free"),"zero_cost_certified":False})
          out={"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "provider":"xKiro","models_total":len(items),"claude_candidates":matches,
               "inference_requests":0,
               "note":"Model catalog only; requires account access and a free-tier eligibility check before any use."}
          with open(sys.argv[2],"w",encoding="utf8") as f:json.dump(out,f,indent=2)
          print("xKiro Claude candidates:",len(matches))
          for x in matches:print("MODEL",x["id"],"tier",x["tier"],"pricing",x["pricing"])
          PY
      - name: Publish metadata evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-claude-public-catalog
          path: |
            ${{ runner.temp }}/provider-audit/results.json
            ${{ runner.temp }}/provider-audit/xkiro-results.json
          if-no-files-found: warn
          retention-days: 7
